---
threat_summary:
  title: "Vendor Exposure, AI-Accelerated Intrusions and Consent Liability: Fireworks AI Fallout, ARTEX, TSMC and Meta's EUR 805 Million Fine"
  report_date: "2026-11-15"
  threat_id: "TI-20261115-008"
  severity_business: "Critical"
  severity_technical: "High"

  executive_summary: |
    Three connected stories dominate this period. First, the FBI warned on November 14,
    2026 that threat actors are using ARTEX, an AI-powered penetration testing framework,
    to automate intrusions, with some progressing from targeting to privileged access in
    under three hours. Second, a single stolen vendor key at Fireworks AI has now been tied
    to Cursor (a trojanized Claude Code extension reaching up to 5,000 users), Uber (driver's
    license data) and Notion. Third, TSMC confirmed leaked employee data matched data
    held by a cloud service provider, and Italy fined Meta EUR 805 million over default
    gallery access in Facebook for Android.

    Boards should care because liability follows data and consent decisions regardless of
    whose server holds the data. TSMC reported no evidence its own systems were compromised
    yet still faces an employee data auction. Meta's fine, about 0.47 percent of global
    revenue, shows privacy regulators can penalize product design choices.

    Time sensitivity is high. TSMC's data auction had a first deadline of November 15
    before free release, ARTEX remains available through forks and a commercial edition, and
    Meta faces a 60-day compliance deadline.

threat_intelligence:
  what_happened:
    incident_overview: |
      ARTEX: Released on GitHub in July 2026 and removed by its developer on October 8
      after abuse reports, ARTEX uses external large language models (including Claude,
      GPT, DeepSeek, GLM, Grok and Kimi) to run reconnaissance, find vulnerabilities,
      escalate privileges and steal data with little human input. The FBI says multiple
      actors have used it since at least August, and that it remains available through
      forks, archives and a commercial edition. Researchers found over 1,600 exposed ARTEX
      consoles as of early November. Documented cases include the October ConnectWise Cloud
      Backup supply-chain attack (Huntress counted at least 162 compromised Microsoft 365
      tenants; Microsoft attributed it to China-aligned Storm-0940, which attempted
      authentication against more than 2,250 downstream tenants), attacks on South Korean
      banks exposing about 67,000 people, and a gang arrested in South Korea for attacks on
      over 90 organizations and about 8.2 million stolen records.

      Fireworks AI: Cursor said an access key it issued to Fireworks was exposed and used to
      copy data from a shared storage bucket holding agent traces, some with unredacted
      credentials (fewer than 0.01 percent of customers). The attacker used these to
      reach other Cursor systems and, on October 29, placed trojanized Claude Code extension
      versions 2.1.312 and 2.1.313 on the marketplace cache for about 11 hours. At most 5,000
      users may have received them. Cursor has moved inference off Fireworks and reports
      no further malicious activity since November 1. Uber disclosed that a service
      provider's compromised credentials exposed thousands of drivers' license records;
      TechCrunch identified the provider as Fireworks AI, which Uber has not confirmed in the
      filing as described. Notion also confirmed data theft tied to the incident.

      TSMC: A threat actor using the alias SmithBianl posted a 499-row sample on November 8,
      claiming a 6.9GB dataset of 46,000 employee records (national IDs, addresses, contact
      and banking details) and opened an auction at 3 BTC (about $65,000). TSMC confirmed
      current and former employee data was exposed, matched it to data held by a cloud
      service provider, found no evidence its own systems were compromised, and says
      operations and customers are unaffected. The record count is the actor's claim.

      Meta: Italy's Garante fined Meta EUR 805 million for a Facebook for Android feature
      that suggested gallery photos, enabled by default under one broad permission, affecting
      about 20 million Italian users. The authority ordered separate consent and default-off
      status within 60 days. Meta calls the fine disproportionate and plans to appeal.

    affected_organizations:
      - name: "Organizations targeted with ARTEX (finance, government, technology, defense, healthcare)"
        impact: "Faster, multi-target intrusions; examples include 162 compromised Microsoft 365 tenants and 67,000 people's data at Korean banks."
      - name: "Cursor and up to 5,000 developers"
        impact: "Trojanized extension served for about 11 hours; internal data and some customer credentials exposed."
      - name: "Uber and Notion (Fireworks AI incident)"
        impact: "Uber: thousands of drivers' license records. Notion: data stolen, details limited."
      - name: "TSMC (semiconductors)"
        impact: "Current and former employee data leaked and auctioned; operations and customers unaffected per company."
      - name: "Meta (Facebook for Android, Italy)"
        impact: "EUR 805 million fine; mandated consent changes; appeal planned."

    attack_methodology: |
      ARTEX converts an operator's goals into commands run by specialized AI agents. It is
      most effective against overlooked systems such as partner portals, employee
      applications, legacy services and third-party integrations. The Fireworks and TSMC
      cases show the other route: credentials or data held at a supplier become the
      entry point. Meta's case is not an attack but a regulatory finding that default
      access without specific consent breaches Italian privacy law.

  why_it_matters:
    business_risks:
      financial_exposure: |
        Meta's fine of EUR 805 million is about 0.47 percent of global revenue. TSMC
        reported $122.4 billion in annual revenue; no breach cost figure is given.
        Employee banking data creates fraud and notification costs. The sources give no
        cost figures for Cursor, Uber or ARTEX victims, so none are asserted.

      regulatory_compliance: |
        Italy applied Article 122 of its Privacy Code, which implements the EU ePrivacy
        Directive; no actual harm or data transmission needs to be shown. GDPR fines can reach
        EUR 20 million or 4 percent of global turnover. TSMC made an SEC filing. Uber
        filed with California. Counsel should confirm which regimes apply.

      competitive_impact: |
        Vendor-driven breaches harm the customer-facing brand. Attackers using AI tools
        lower the skill needed to run multi-target campaigns, widening the attacker pool.

      operational_disruption: |
        Cursor disabled services and rebuilt its marketplace. Meta must change its product
        and consent flow within 60 days. Short intrusion timelines (under three hours) leave
        little time to respond.

    industry_patterns:
      affected_sectors:
        - "Semiconductors and manufacturing"
        - "AI and developer platforms"
        - "Technology and social media"
        - "Banking and financial services"
        - "Mobility and productivity software"

      trend_analysis: |
        A worsening pattern. The Fireworks AI key theft has now reached at least four named
        companies. ARTEX spread through forks even after its developer removed it. Privacy
        regulators are also acting on product design, not only breaches.

