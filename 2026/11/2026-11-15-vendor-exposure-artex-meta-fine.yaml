    - "Unexpected extension versions in developer marketplaces"
    - "Application permissions broader than the feature requiring them"

strategic_response:
  executive_decisions:
    - priority: "Critical"
      decision: "Inventory every vendor holding employee or customer data, name an owner for each, and require breach notification and key-revocation duties in contracts."
      business_justification: "TSMC and the Fireworks victims were affected through vendors."
      cost_estimate: "Low to moderate; procurement and legal effort."

    - priority: "Critical"
      decision: "Set and test a one-hour target for revoking a compromised vendor's access."
      business_justification: "ARTEX-style intrusions can reach privileged access in under three hours."
      cost_estimate: "Low; drills and process."

    - priority: "High"
      decision: "Require legal and privacy review of every permission request and consent screen."
      business_justification: "Meta's fine was based on permission design, regardless of harm."
      cost_estimate: "Low; review process."

    - priority: "High"
      decision: "Prioritize security of partner portals, legacy services and third-party integrations."
      business_justification: "The FBI says ARTEX is effective against these overlooked systems."
      cost_estimate: "Moderate; discovery and remediation."

    - priority: "High"
      decision: "Remove secrets from logs, traces and shared datasets, and set retention limits."
      business_justification: "Unredacted credentials in shared traces extended the Cursor breach."
      cost_estimate: "Low to moderate; engineering and governance."

  governance_implications:
    board_reporting: |
      Report quarterly: vendors with employee or customer data and share with named owners;
      vendor access revocation time in drills; internet-facing legacy and partner systems
      inventoried; secrets found in shared datasets; consent reviews completed for
      user-facing features.

    disclosure_requirements: |
      Confirm duties with counsel: privacy regulators, securities filings (TSMC filed with
      the SEC), state breach laws (Uber filed in California), and ePrivacy or GDPR consent
      rules. Employees whose banking data is exposed need prompt notification. Organizations
      can report ARTEX activity to the FBI or its IC3. This note is not legal advice.

analysis_and_insights:
  uncomfortable_truths: |
    A clean internal environment is not safety. TSMC said it found no evidence its own
    systems were compromised, while employee data was being auctioned. Likewise, Meta's
    liability arose from design choices, not an attack. Security and privacy exposure now
    includes what you ask users to approve and what you let suppliers hold.

    AI tooling changes the pace. Programs built around weekly review cycles do not fit
    intrusions that reach privileged access within hours. Vendors promising detection
    should be asked how it helps at that speed.

  strategic_lessons:
    - "Data at your vendors is your exposure."
    - "Consent design is a legal and security control."
    - "Overlooked internet-facing systems are the first targets for automated attackers."
    - "Distinguish attacker claims from confirmed facts in board reports."

forward_outlook:
  predictions: |
    Over the next 6 to 12 months, expect continued fallout from the Fireworks AI incident
    and similar vendor key thefts, wider use of ARTEX and copies by actors of varied skill,
    and more extortion through data auctions.

    Expect regulators to scrutinize default permissions and consent flows following Italy's
    action, and Meta's appeal to be watched as a reference point. The Garante may also
    examine a newer cloud-processing feature.

