---
threat_summary:
  title: "Vendor Credentials as the Master Key: Expedia Supply Chain Breach Claims, Cursor Marketplace Compromise and FaceStealer Disruption"
  report_date: "2026-11-14"
  threat_id: "TI-20261114-007"
  severity_business: "Critical"
  severity_technical: "High"

  executive_summary: |
    Expedia Group confirmed on November 12, 2026 that attackers reached its systems through
    a compromised third-party data platform provider, in a supply chain attack that also
    affected other companies. A newly formed Russian extortion group, n0n, claims it stole
    data on nearly one billion travelers, including 830 million loyalty records from 35
    programs. Expedia has not confirmed those figures and says its investigation is ongoing.
    Wiz and Sentra attribute the access to a stolen vendor key from Qubole.

    Separately, Cursor confirmed that credentials stolen from AI infrastructure provider
    Fireworks AI led to a breach of its systems and the publication of malicious Claude
    Code extension versions on its marketplace for about 11 hours, exposing up to 5,000
    developers. The U.S. also disrupted North Korea's FaceStealer campaign, which stole
    more than $400 million in crypto using deepfake video calls.

    Boards should care because vendor-held credentials are producing chain reactions across
    companies. Time sensitivity is high: Wiz describes a wave of attacks on AI developer
    platforms, UnrealIRCd exploitation began within a day of a patch, and credentials
    exposed in earlier incidents may still be in use.

threat_intelligence:
  what_happened:
    incident_overview: |
      Expedia: the group n0n claims 830 million loyalty program records, 58 million traveler
      profiles, 333 million consumer account records with password-like tokens, about 2.5
      million credit card spending records linked to hashed emails, 72 million consumer
      matching records and 500,000 guest records. It also claims source code, taken through
      live credentials captured the same way. These figures are the group's claims. Expedia
      says its platforms remain safe for travelers and partners. N0n emerged in mid-September,
      steals data and extorts without ransomware, and its leak site lists victims as numbered
      companies with countdown timers, claiming 224 attacks since September. A ransom
      negotiator not working on the case noted that Expedia's public confirmation could
      weaken the group's pressure tactic.

      Cursor: attackers obtained an access key stored at Fireworks AI and used it to copy
      data from a storage bucket containing historical AI coding-agent traces, mostly from
      2025, from users without Privacy Mode. Some traces contained unredacted API
      credentials, which opened more Cursor systems. Cursor says fewer than 0.05 percent of
      users had traces exposed and fewer than 0.01 percent of customers had credentials
      compromised. Stolen data included archived non-production source code, limited
      support data and credentials customers had shared with support. On October 29, an
      attacker used a stolen credential to place malicious copies of Anthropic's Claude Code
      extension (versions 2.1.312 and 2.1.313) on the cache serving Cursor's marketplace.
      They attempted to install SSH backdoors, though coding errors likely stopped them on
      many Windows and macOS systems. Anthropic's legitimate extension and Open VSX were
      not compromised.

      Wiz calls the broader wave "Black October": attacks on AI developer platforms,
      including Railway, Northflank, Lightning AI, OpenCode, Warp and Fireworks AI, to steal
      credentials for AI access. Railway customers faced about $740,000 in fraudulent AI
      charges. Fireworks incidents also affected Notion, which disclosed exposed AI chat
      transcripts for a small number of workspaces.

      Other findings: the U.S. disrupted FaceStealer, a BlueNoroff-attributed campaign
      using hijacked messaging accounts, recorded and deepfake video, and fake technical
      "fixes"; Arctic Wolf identified 677 targets in 58 countries and the FBI seized over 900
      victim webcam videos. The Justice Department says more than $2.7 billion has been
      frozen from a Binance-related theft, with over $1.2 billion subject to seizure orders.
      CISA also added UnrealIRCd flaw CVE-2026-114713 to its exploited list; exploitation began
      a day after the fix on November 7.

    affected_organizations:
      - name: "Expedia Group (Expedia, Hotels.com, Vrbo and related brands)"
        impact: "Breach through a third-party data platform confirmed; claimed theft of nearly one billion records unverified; investigation ongoing."
      - name: "Other companies reached through the same third-party provider"
        impact: "Confirmed as affected by Expedia, not named in the sources."
      - name: "Cursor and up to 5,000 developers"
        impact: "Malicious extension served for about 11 hours; internal data and customer credentials exposed; marketplace rebuilt."
      - name: "AI developer platforms (Railway, Northflank, Lightning AI, OpenCode, Warp, Fireworks AI)"
        impact: "Credential theft leading to unauthorized AI usage, including about $740,000 at Railway."
      - name: "Cryptocurrency and Web3 executives and open-source developers"
        impact: "More than $400 million stolen over 18 months through FaceStealer."

    attack_methodology: |
      The unifying method is vendor credential theft followed by trusted access. At Expedia,
      a stolen vendor key gave attackers a path into a big data platform. At Cursor, a key at
      a supplier opened shared data that held more credentials, which led to a marketplace
      credential. Each step used something that was supposed to be trusted.

      FaceStealer uses social trust: a real recorded colleague and a fake error persuade
      the target to run malware. The sources report that attackers sometimes waited months or
      over a year after compromise, likely for crypto holdings to grow.

  why_it_matters:
    business_risks:
      financial_exposure: |
        Expedia reported $14.7 billion in revenue in 2025. Costs from a confirmed breach
        would include investigation, notification, credential resets, legal and extortion
        pressure, but the sources give no cost figures for Expedia, and the record counts
        are unverified claims. Railway's estimated $740,000 in fraudulent AI charges shows
        direct cash exposure from stolen AI keys. FaceStealer stole over $400 million.

      regulatory_compliance: |
        Breach of personal data on this scale, if confirmed, may trigger GDPR (fines up to
        EUR 20 million or 4 percent of global turnover), U.S. state breach laws and payment
        card obligations. The claimed credit card spending records, if real, add scrutiny.
        Counsel should confirm applicability by jurisdiction.

      competitive_impact: |
        Travel customers can leave brands they no longer trust. Loyalty balances and email
        addresses allow convincing phishing, which compounds reputational harm. Expedia's
        public confirmation may blunt the extortionists' leverage but invites scrutiny.

      operational_disruption: |
        Cursor temporarily turned off some services, moved inference traffic away from
        Fireworks, rebuilt its marketplace and redeployed production. Credential rotation
        across vendors is slow, especially where old data contained live secrets.

    industry_patterns:
      affected_sectors:
        - "Travel and hospitality"
        - "AI and developer platforms"
        - "Cryptocurrency and Web3"
        - "Cloud and data platforms"
        - "Open-source software"

      trend_analysis: |
        A persistent and worsening pattern. The Qubole key theft earlier this month is now
        tied to a major consumer brand. Wiz reports a wave of AI developer platform breaches
        targeting stored credentials. Compromise at one vendor spreads to its customers and
        their customers, as with Fireworks affecting Cursor and Notion.

technical_context:
  vulnerability_details:
    cve_identifier: "CVE-2026-114713 (UnrealIRCd, CVSS 8.6, exploited). Expedia, Cursor and FaceStealer: no CVE; stolen credentials and social engineering."
    vulnerability_type: "Stolen vendor credentials, secrets left in historical data, compromised marketplace publishing credential, command injection in chat server software"
    affected_systems:
      - "Third-party data platform integrations (Qubole key per Wiz and Sentra)"
      - "Cursor VS Code extension marketplace cache"
      - "Fireworks AI storage and development environments"
      - "UnrealIRCd 6.0.0 before 6.2.7.1 on networks with two or more linked servers"
    exploitation_status: "Active (Expedia third-party breach confirmed; Cursor extension distributed; UnrealIRCd exploited; FaceStealer disrupted but similar tactics continue)"

  attack_indicators:
    - "Vendor notifications of key or credential exposure"
    - "Extortion countdown listings or claims naming your company or vendors"
    - "Unexpected extension versions in developer marketplaces"
    - "Unauthorized AI usage charges or credential reset requests from providers"
    - "Meeting invitations from known contacts followed by fake technical errors"

strategic_response:
  executive_decisions:
    - priority: "Critical"
      decision: "Inventory every vendor connection that touches customer data, with its credentials and a named owner, and rotate keys on a schedule."
      business_justification: "Expedia and Cursor were reached through vendor-held credentials."
      cost_estimate: "Moderate; weeks of effort and ongoing process."

    - priority: "Critical"
      decision: "Adopt a data-retention and redaction rule for logs, traces and shared datasets that may contain secrets."
      business_justification: "Cursor's exposure grew because old traces contained live credentials."
      cost_estimate: "Low to moderate; engineering and data governance."

    - priority: "High"
      decision: "Write 24-hour breach notification and credential-revocation duties into vendor contracts."
      business_justification: "Faster notice shortens the window before stolen access is used."
      cost_estimate: "Low; legal and procurement time."

    - priority: "High"
      decision: "Run a vendor-compromise drill: revoke a top vendor's access within an hour and measure."
      business_justification: "Without a tested process, revocation is improvised."
      cost_estimate: "Low; staff time."

    - priority: "High"
      decision: "Restrict marketplace extensions and developer tools to approved versions and require out-of-band verification for meeting-based requests."
      business_justification: "Cursor's extension reached up to 5,000 developers; FaceStealer targets developers and executives."
      cost_estimate: "Low to moderate; policy and tooling."

  governance_implications:
    board_reporting: |
      Report quarterly: number of vendors with customer-data access and share with a named
      owner; credentials older than policy; time to revoke a vendor's access in drills;
      percent of vendor contracts with notification terms; and logs or datasets containing
      detected secrets.

    disclosure_requirements: |
      Confirm duties with counsel: privacy regulators, payment card rules, state breach
      laws, securities disclosure for listed companies, and contractual notice. Customers
      should be told to change passwords and watch for phishing where credentials may be
      exposed. This note is not legal advice.

analysis_and_insights:
  uncomfortable_truths: |
    A vendor's weakest credential is your weakest credential. Annual questionnaires do
    not show whether a supplier's key sits in an exposed bucket or whether old logs hold
    live secrets. The same Qubole access theft reported earlier is still producing
    downstream victims.

    Extortion claims are also not facts. N0n's record counts are unverified and its
    tactic depends on pressure. Confirming what is known and refusing to amplify
    unverified numbers is part of good incident response.

  strategic_lessons:
    - "Vendor-held keys are a primary attack path; inventory and rotate them."
    - "Do not retain or share logs and traces that may contain secrets."
    - "Treat marketplace extensions as supply chain risk."
    - "Separate confirmed facts from attacker claims in board reporting."

forward_outlook:
  predictions: |
    Over the next 6 to 12 months, expect more downstream victims from vendor credential
    theft, more attacks on AI developer platforms and marketplaces, and continued data-theft
    extortion without ransomware. Regulators and insurers will likely ask for vendor access
    inventories.

    Expect North Korea-linked actors to adapt after the seizures and keep targeting
    executives and developers. UnrealIRCd shows exploitation can start within a day of a
    fix, so rapid rotation and patching processes matter.

