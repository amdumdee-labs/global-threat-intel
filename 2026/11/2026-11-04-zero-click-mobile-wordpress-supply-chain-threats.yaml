  vulnerability_details:
    cve_identifier: "CVE-2026-119977 (WordPress Core, actively exploited); CVE-2026-58868 and CVE-2026-58882 (Android, November bulletin); CVE-2025-43529, CVE-2024-27834, CVE-2026-20700, CVE-2025-14174, CVE-2025-43510, CVE-2025-43520, CVE-2026-3910, CVE-2025-27038 (iOS and Chrome for Android, used by APT29-linked campaign); CVE-2026-120422 (Sogou Input Method)"
    vulnerability_type: "Silent device exploitation through compromised websites; timing flaw in WordPress upgrades allowing remote code execution; memory-handling flaws in Android; unencrypted software update requests that can be redirected"
